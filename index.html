<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>README Viewer</title>

    <!-- GitHub Markdown CSS - Dark Mode -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-dark.css"
    >

    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="readme-container">

        <header class="readme-header">

            <!-- GitHub-style file icon -->
            <svg
                class="file-icon"
                viewBox="0 0 16 16"
                aria-hidden="true"
            >
                <path
                    d="M3.75 1.75A1.75 1.75 0 0 1 5.5 0h3.879c.464 0 .909.184 1.237.513l2.871 2.87c.329.329.513.774.513 1.238V14.25A1.75 1.75 0 0 1 12.25 16h-6.5A1.75 1.75 0 0 1 4 14.25V1.75h-.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h6.75a.25.25 0 0 0 .25-.25V5h-2.25A1.75 1.75 0 0 1 8.5 3.25V1.5H5.5Zm4.5.31V3.25c0 .138.112.25.25.25h1.44L10 1.81Z"
                />
            </svg>

            <span>README.md</span>

        </header>

        <article
            id="content"
            class="markdown-body"
        >
            <p class="loading">
                Loading README...
            </p>
        </article>

    </main>

    <script src="script.js"></script>

</body>
</html>
